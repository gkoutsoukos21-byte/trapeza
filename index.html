<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Τράπεζα Θεμάτων · Μαθηματικά</title>
<meta name="description" content="Τα θέματα της Τράπεζας Θεμάτων του ΙΕΠ για τα Μαθηματικά Λυκείου (ΓΕΛ & ΕΠΑΛ), με εκφωνήσεις και ενδεικτικές απαντήσεις.">
<meta name="theme-color" content="#1f4e5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Τράπεζα Θεμάτων">
<style>
:root{
  --brand:#1f4e5f; --brand-2:#2c6e84; --accent:#e07a2e;
  --bg:#f3f5f7; --card:#fff; --ink:#1b2430; --muted:#5e6b78; --line:#dde3e9;
  --ok:#2f7d4f; --chip:#e8eef2; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .back{background:none;border:0;color:#fff;font-size:24px;padding:4px 6px;cursor:pointer;visibility:hidden}
header .back.show{visibility:visible}
header .title{flex:1;min-width:0}
header h1{margin:0;font-size:19px;line-height:1.15}
header small{opacity:.8;font-size:13px}
header .cart{position:relative;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15px;display:flex;gap:6px;align-items:center}
header .cart b{background:var(--accent);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(20,40,60,.08)}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 8px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
.seg button.on,.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.subjects{display:grid;gap:10px}
.subj{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left;cursor:pointer;width:100%}
.subj:hover{border-color:var(--brand-2)}
.subj span{color:var(--muted);font-size:14px}
.code-search{display:flex;gap:8px}
.code-search input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--brand);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.orange{background:var(--accent)}
.btn.ghost{background:none;color:var(--brand);padding:8px 10px;min-height:36px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mats{display:grid;gap:4px;max-height:none}
.mat{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:10px;cursor:pointer}
.mat:hover{background:#f6f8fa}
.mat input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--brand)}
.mat small{color:var(--muted);margin-left:auto;padding-left:8px;white-space:nowrap}
.switch{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px;border-radius:10px;background:#f6f8fa;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sum b{font-size:18px}
.item{background:var(--card);border-radius:var(--radius);padding:14px 14px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,60,.08)}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item .code{font-weight:700;font-size:17px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--chip)}
.badge.q2{background:#e3f1e8;color:#235c3a}.badge.q3{background:#fdf0dc;color:#7a4b10}.badge.q4{background:#fde4e1;color:#8a2a1f}
.item .meta{color:var(--muted);font-size:14px;margin:6px 0 10px}
.item .where{font-size:13px;color:var(--muted);margin-top:-4px;margin-bottom:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1/-1}
.actions .btn{width:100%}
.sol{background:#fff6ee;color:#8a4a12}
.added{background:#e3f1e8;color:#235c3a}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 16px 30px;max-width:760px;margin:0 auto}
footer a{color:var(--brand-2)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(120px);background:#1b2430;color:#fff;padding:12px 18px;border-radius:12px;transition:transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.install{display:none}
.install.show{display:block}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.hidden{display:none!important}
@media (min-width:600px){.subjects{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <button class="back" id="backBtn" aria-label="Πίσω">←</button>
  <div class="title"><h1>Τράπεζα Θεμάτων</h1><small>Μαθηματικά Λυκείου · ΓΕΛ &amp; ΕΠΑΛ</small></div>
  <button class="cart" id="cartBtn" aria-label="Λίστα εκτύπωσης">🖨️ <b id="cartCount">0</b></button>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<footer>
  Τα θέματα προέρχονται από την πλατφόρμα της Τράπεζας Θεμάτων Διαβαθμισμένης Δυσκολίας του
  <a href="https://trapeza.iep.edu.gr" target="_blank" rel="noopener">Ινστιτούτου Εκπαιδευτικής Πολιτικής (Ι.Ε.Π.)</a>.
  Τα αρχεία ανοίγουν απευθείας από τον ιστότοπο του Ι.Ε.Π.<br>
  <span id="updated"></span>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
