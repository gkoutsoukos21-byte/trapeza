<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Τράπεζα Θεμάτων</title>
<meta name="description" content="Τα θέματα της Τράπεζας Θεμάτων του ΙΕΠ για Μαθηματικά, Φυσική, Χημεία και Βιολογία Λυκείου (ΓΕΛ & ΕΠΑΛ), με εκφωνήσεις και ενδεικτικές απαντήσεις.">
<meta name="theme-color" content="#163A5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Τράπεζα Θεμάτων">
<script src="config.js"></script>
<script>
  (function(){var c=(window.BRAND||{}).colors||{},r=document.documentElement.style;
  if(c.primary)r.setProperty('--brand',c.primary); if(c.accent)r.setProperty('--accent',c.accent);
  if(c.silver)r.setProperty('--silver',c.silver); if(c.text)r.setProperty('--ink',c.text); if(c.bg)r.setProperty('--card',c.bg);})();
</script>
<style>
:root{
  --brand:#163A5F; --accent:#C84B20; --silver:#B8BDC2; --ink:#2B303A; --card:#FFFFFF;
  --bg:#F3F5F7; --muted:#5f6772; --line:#dfe3e7; --chip:#eef1f4; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:#fff;color:var(--brand);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--accent);box-shadow:0 2px 8px rgba(22,58,95,.08)}
header .back{background:none;border:0;color:var(--brand);font-size:24px;padding:4px 6px;cursor:pointer;display:none}
header .back.show{display:block}
header .logo{height:40px;width:auto;display:block;max-width:46vw;object-fit:contain}
header .title{flex:1;min-width:0;line-height:1.15;border-left:1px solid var(--silver);padding-left:10px}
header h1{margin:0;font-size:16px;color:var(--brand)}
header small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .cart{position:relative;margin-left:auto;background:var(--brand);border:0;color:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:15px;display:flex;gap:6px;align-items:center;flex:none}
header .cart b{background:var(--accent);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(22,58,95,.06)}
h2{font-size:17px;margin:0 0 10px;color:var(--brand)}
h3{font-size:15px;margin:14px 0 8px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--silver);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.subjects{display:grid;gap:10px}
.subj{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--silver);background:#fff;border-radius:12px;padding:14px;text-align:left;cursor:pointer;width:100%;color:var(--brand)}
.subj:hover{border-color:var(--accent)}
.subj span{color:var(--muted);font-size:14px}
.code-search{display:flex;gap:8px}
.code-search input{flex:1;min-width:0;border:1.5px solid var(--silver);border-radius:12px;padding:10px 12px;min-height:44px}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--brand);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.orange{background:var(--accent)}
.btn.sol{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost{background:none;color:var(--brand);padding:8px 10px;min-height:36px}
.btn.added{background:#e6f2ea;color:#22603c}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mats{display:grid;gap:2px}
.mat{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:10px;cursor:pointer}
.mat:hover{background:#f6f8fa}
.mat input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--brand)}
.mat small{color:var(--muted);margin-left:auto;padding-left:8px;white-space:nowrap}
.switch{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px;border-radius:10px;background:#f6f8fa;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sum b{font-size:18px;color:var(--brand)}
.item{background:var(--card);border-radius:var(--radius);padding:14px 14px 12px;margin-bottom:12px;border:1px solid var(--line);border-left:4px solid var(--brand);box-shadow:0 1px 3px rgba(22,58,95,.06)}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item .code{font-weight:700;font-size:17px;color:var(--brand)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--chip)}
.badge.q2{background:#e7eef6;color:var(--brand)}.badge.q3{background:#f2f2f2;color:#555}.badge.q4{background:#fbe9e2;color:var(--accent)}
.item .meta{color:var(--muted);font-size:14px;margin:6px 0 10px}
.item .where{font-size:13px;color:var(--muted);margin-top:-2px;margin-bottom:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1/-1}
.actions .btn{width:100%}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 16px 30px;max-width:760px;margin:0 auto}
footer a{color:var(--brand)}
footer .brandline{font-weight:600;color:var(--brand);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;transition:transform .25s;z-index:80;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.install{display:none}
.install.show{display:block}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.hidden{display:none!important}
.kwmodes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 8px}
.kwmodes button{border:1.5px solid var(--silver);background:#fff;border-radius:12px;padding:9px 4px;min-height:44px;cursor:pointer;font-size:14px;font-weight:600;color:var(--brand)}
.kwmodes button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.kwtitle{font-weight:700;color:var(--brand);margin:4px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--brand)}
.kwgroup.rel .kwtitle{color:var(--accent);border-color:var(--accent)}
.kwgroup.rel .item{border-left-color:var(--accent)}
.snip{font-size:14px;line-height:1.5;background:#f6f8fa;border-radius:8px;padding:8px 10px;margin:-4px 0 10px;color:var(--ink)}
.snip mark{background:#fde3c8;color:inherit;border-radius:3px;padding:0 2px}
.why{font-size:13px;color:var(--accent);margin:-4px 0 10px}
.kws{font-size:13.5px;line-height:1.45;color:var(--ink);background:#f6f8fa;border-radius:8px;padding:6px 10px;margin:-4px 0 10px}
.kws mark{background:#fde3c8;color:inherit;border-radius:3px;padding:0 2px}
/* ----- PDF viewer ----- */
#viewer{position:fixed;inset:0;z-index:60;background:#5b6168;display:flex;flex-direction:column}
#viewer .vbar{background:#fff;border-bottom:3px solid var(--accent);padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;display:flex;align-items:center;gap:6px}
#viewer .vbar .vt{flex:1;min-width:0;font-weight:700;color:var(--brand);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vbar .vt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
#viewer .ib{border:0;background:var(--chip);color:var(--ink);border-radius:10px;min-width:40px;height:40px;font-size:18px;cursor:pointer;padding:0 10px;font-weight:600}
#viewer .ib.primary{background:var(--brand);color:#fff}
#viewer .ib.orange{background:var(--accent);color:#fff;font-size:14px}
#viewer .vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 0 calc(env(safe-area-inset-bottom) + 70px)}
#viewer .vbody canvas{display:block;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);max-width:none}
#viewer .vmsg{color:#fff;text-align:center;padding:40px 20px}
#viewer .vmsg a{color:#fff}
#viewer .vsrc{color:#e8eaed;font-size:11px;line-height:1.35;max-width:760px;margin:6px auto 0;padding:0 14px;text-align:center}
#viewer .vfoot{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.35))}
#viewer .vfoot .btn{flex:1;max-width:240px}
@media (min-width:600px){.subjects{grid-template-columns:1fr 1fr} header .logo{height:46px}}
@media (max-width:520px){header .title{display:none} header .logo{height:42px;max-width:62vw}}
.hero{margin:2px 2px 12px;color:var(--brand);font-size:15px}
.hero b{font-size:19px;display:block}
</style>
</head>
<body>
<header>
  <button class="back" id="backBtn" aria-label="Πίσω">←</button>
  <img class="logo" id="brandLogo" alt="">
  <div class="title"><h1 id="appTitle">Τράπεζα Θεμάτων</h1><small id="appSub"></small></div>
  <button class="cart" id="cartBtn" aria-label="Λίστα εκτύπωσης">🖨️ <b id="cartCount">0</b></button>
</header>

<main id="app"></main>

<div id="viewer" class="hidden" role="dialog" aria-modal="true">
  <div class="vbar">
    <button class="ib" id="vClose" aria-label="Κλείσιμο">←</button>
    <div class="vt" id="vTitle"></div>
    <button class="ib" id="vOut" aria-label="Σμίκρυνση">−</button>
    <button class="ib" id="vIn" aria-label="Μεγέθυνση">+</button>
  </div>
  <div class="vbody" id="vBody"></div>
  <div class="vfoot">
    <button class="btn orange" id="vSwap"></button>
    <button class="btn alt" id="vCart"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>
  <div class="brandline" id="brandLine"></div>
  <div id="srcNote"></div>
  <br><span id="updated"></span>
</footer>

<script src="data.js"></script>
<script src="concepts.js"></script>
<script src="app.js"></script>
</body>
</html>
